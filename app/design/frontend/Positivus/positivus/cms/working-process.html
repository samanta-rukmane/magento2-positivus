<section id="working-process" class="mx-auto max-w-7xl px-6 py-16">

  <!-- Section heading -->
  <div class="mb-12 flex flex-col gap-4 md:flex-row md:items-center md:gap-10">
    <h2 class="inline-block rounded-md bg-[#B9FF66] px-2 text-3xl font-medium">
      Our Working Process
    </h2>
    <p class="max-w-xl text-lg">
      Step-by-Step Guide to Achieving <br> Your Business Goals
    </p>
  </div>

  <!-- Working process steps -->
  <div class="flex flex-col gap-5">

    <!-- Step 1: Active -->
    <div data-process-step class="rounded-[2rem] border border-[#191A23] bg-[#B9FF66] p-6 shadow-[0_5px_0_#191A23] md:rounded-[45px] md:p-8">
      <div class="flex items-center justify-between gap-4">
        <div class="flex items-center gap-4 md:gap-6">
          <span class="text-3xl font-medium md:text-6xl">01</span>
          <h3 class="text-xl font-medium md:text-3xl">Consultation</h3>
        </div>

        <button
          type="button"
          class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-[#191A23] bg-[#F3F3F3] text-3xl leading-none md:h-14 md:w-14"
          aria-label="Close Consultation"
        >
          −
        </button>
      </div>
    </div>

    <!-- Step 2 -->
    <div data-process-step class="rounded-[2rem] border border-[#191A23] bg-[#F3F3F3] p-6 shadow-[0_5px_0_#191A23] md:rounded-[45px] md:p-8">
      <div class="flex items-center justify-between gap-4">
        <div class="flex items-center gap-4 md:gap-6">
          <span class="text-3xl font-medium md:text-6xl">02</span>
          <h3 class="text-xl font-medium md:text-3xl">Research and Strategy Development</h3>
        </div>
        <button type="button" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-[#191A23] bg-[#F3F3F3] text-3xl leading-none md:h-14 md:w-14" aria-label="Open Research and Strategy Development">+</button>
      </div>
    </div>

    <!-- Step 3 -->
    <div data-process-step class="rounded-[2rem] border border-[#191A23] bg-[#F3F3F3] p-6 shadow-[0_5px_0_#191A23] md:rounded-[45px] md:p-8">
      <div class="flex items-center justify-between gap-4">
        <div class="flex items-center gap-4 md:gap-6">
          <span class="text-3xl font-medium md:text-6xl">03</span>
          <h3 class="text-xl font-medium md:text-3xl">Implementation</h3>
        </div>
        <button type="button" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-[#191A23] bg-[#F3F3F3] text-3xl leading-none md:h-14 md:w-14" aria-label="Open Implementation">+</button>
      </div>
    </div>

    <!-- Step 4 -->
    <div data-process-step class="rounded-[2rem] border border-[#191A23] bg-[#F3F3F3] p-6 shadow-[0_5px_0_#191A23] md:rounded-[45px] md:p-8">
      <div class="flex items-center justify-between gap-4">
        <div class="flex items-center gap-4 md:gap-6">
          <span class="text-3xl font-medium md:text-6xl">04</span>
          <h3 class="text-xl font-medium md:text-3xl">Monitoring and Optimization</h3>
        </div>
        <button type="button" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-[#191A23] bg-[#F3F3F3] text-3xl leading-none md:h-14 md:w-14" aria-label="Open Monitoring and Optimization">+</button>
      </div>
    </div>

    <!-- Step 5 -->
    <div data-process-step class="rounded-[2rem] border border-[#191A23] bg-[#F3F3F3] p-6 shadow-[0_5px_0_#191A23] md:rounded-[45px] md:p-8">
      <div class="flex items-center justify-between gap-4">
        <div class="flex items-center gap-4 md:gap-6">
          <span class="text-3xl font-medium md:text-6xl">05</span>
          <h3 class="text-xl font-medium md:text-3xl">Reporting and Communication</h3>
        </div>
        <button type="button" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-[#191A23] bg-[#F3F3F3] text-3xl leading-none md:h-14 md:w-14" aria-label="Open Reporting and Communication">+</button>
      </div>
    </div>

    <!-- Step 6 -->
    <div data-process-step class="rounded-[2rem] border border-[#191A23] bg-[#F3F3F3] p-6 shadow-[0_5px_0_#191A23] md:rounded-[45px] md:p-8">
      <div class="flex items-center justify-between gap-4">
        <div class="flex items-center gap-4 md:gap-6">
          <span class="text-3xl font-medium md:text-6xl">06</span>
          <h3 class="text-xl font-medium md:text-3xl">Continual Improvement</h3>
        </div>
        <button type="button" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-[#191A23] bg-[#F3F3F3] text-3xl leading-none md:h-14 md:w-14" aria-label="Open Continual Improvement">+</button>
      </div>
    </div>

  </div>

    <script>
    document.addEventListener('DOMContentLoaded', function () {
    const steps = document.querySelectorAll('#working-process [data-process-step]');

    const descriptions = [
        'During the initial consultation, we will discuss your business goals and objectives, target audience, and current marketing efforts. This will allow us to understand your needs and tailor our services to best fit your requirements.',
        'We research your industry, competitors, and audience, then create a customized marketing strategy aligned with your business objectives.',
        'Our team puts the strategy into action, launching carefully planned campaigns and implementing the agreed marketing activities.',
        'We continuously track campaign performance, analyze results, and optimize our approach to improve effectiveness and achieve better outcomes.',
        'We provide regular reports on key performance indicators, explain the results, and keep you informed about progress and next steps.',
        'We use performance insights and feedback to refine the strategy, identify new opportunities, and support your long-term business growth.'
    ];

    function setStepState(step, isOpen, index) {
        step.classList.toggle('bg-[#B9FF66]', isOpen);
        step.classList.toggle('bg-[#F3F3F3]', !isOpen);

        const button = step.querySelector('button');
        button.textContent = isOpen ? '−' : '+';
        button.setAttribute(
        'aria-label',
        (isOpen ? 'Close ' : 'Open ') +
        step.querySelector('h3').textContent
        );

        let details = step.querySelector('[data-process-details]');

        if (isOpen) {
        if (!details) {
            details = document.createElement('div');
            details.dataset.processDetails = '';
            details.innerHTML =
            '<div class="my-6 border-t border-[#191A23]"></div>' +
            '<p class="text-base leading-relaxed"></p>';
            step.appendChild(details);
        }

        details.querySelector('p').textContent = descriptions[index];
        } else if (details) {
        details.remove();
        }
    }

    steps.forEach(function (step, index) {
        setStepState(step, index === 0, index);

        step.querySelector('button').addEventListener('click', function () {
        const isCurrentlyOpen = step.querySelector('[data-process-details]');

        steps.forEach(function (otherStep, otherIndex) {
            setStepState(
            otherStep,
            otherStep === step ? !isCurrentlyOpen : false,
            otherIndex
            );
        });
        });
    });
    });
    </script>

</section>
